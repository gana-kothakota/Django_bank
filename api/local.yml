services:
  api: &api
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    volumes:
      - .:/app:z
      - ./staticfiles:/app/staticfiles
    # ports:
    #   - "8000:8000"
    expose:
        - "8000"
    env_file:
      - ./.envs/.env.local
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
      - mailpit
      - redis
      - rabbitmq
      - celerybeat
    command: /start.sh
    networks:
      - banker_local_nw

  postgres:
    build:
      context: .
      dockerfile: ./docker/local/postgres/Dockerfile
    volumes:
      - banker_postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./.envs/.env.local
    networks:
      - banker_local_nw

  mailpit:
    image: docker.io/axllent/mailpit:v1.20.3
    container_name: banker_mailpit
    networks:
      - banker_local_nw
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - banker_mailpit_db:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mail.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  redis:
    image: redis:7.4.1-alpine3.19
    command: redis-server --appendonly yes
    networks: 
        - banker_local_nw
  rebbitmq:
    image: rebbitmq:3-management
    ports:
        - "5672:5672"
        - "15672:15672"
    volumes:
        - rebbitmq_data:/var/lib/rabbitmq
        - rebbitmq_logs:/var/log/rabbitmq
    networks:
        - banker_local_nw

  celeryworker:
    <<: *api 
    command: /start-celeryworker.sh
    
  flower:
    <<: *api 
    ports: 
      - "5555:5555"
    volumes:
      - flower_db:/app 
    command: /start-flower.sh 

  celerybeat:
    build: 
      context: .  
      dockerfile: ./docker/local/django/Dockerfile
    command: /start-celerybeat.sh  
    env_file:
        - ./.envs/.env.local
    depend_on:
        - rabbitmq
        - redis
        - postgres
    networks: 
        - banker_local_nw
    
  nginx:
    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./staticfiles:/app/staticfiles
      - logs_store:/var/log/nginx
    depends_on:
      - api
    networks:
      - banker_local_nw

networks:
  banker_local_nw:
    external: true

volumes:
  banker_mailpit_db:
  banker_postgres_db:
  logs_store:
  rabbitmq_data:
  rabbitmq_logs:
  flower_db:  